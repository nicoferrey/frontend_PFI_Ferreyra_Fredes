    <circle cx="512" cy="512" r="320" fill="#10B981" opacity="0.18" filter="url(#ambientGlow)" />
    <circle cx="600" cy="580" r="260" fill="#0284C7" opacity="0.18" filter="url(#ambientGlow)" />

    <g transform="translate(0, -10)">
      <path
        d="M 280 520 
           C 280 380, 390 270, 530 270 
           C 640 270, 730 330, 770 425 
           C 785 420, 800 418, 815 418 
           C 905 418, 980 493, 980 585 
           C 980 677, 905 750, 815 750 
