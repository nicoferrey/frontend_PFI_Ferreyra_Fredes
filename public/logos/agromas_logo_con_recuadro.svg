      <circle cx="750" cy="410" r="36" fill="#10B981" opacity="0.5" />

      <circle cx="440" cy="720" r="80" fill="url(#iconDropGrad)" />
      <circle cx="440" cy="890" r="50" fill="url(#iconDropGrad)" opacity="0.9" />
      
      <circle cx="310" cy="760" r="34" fill="#34D399" />
      <circle cx="335" cy="850" r="18" fill="#059669" />

      <path
